name: clips
# A job file in jobs/ runs here: fetch, transcribe, then either candidates (no clips picked yet, committed back to
# results/ for picking) or rendered clips. Every job file gets its own runner, so a push with many job files renders
# them side by side. Rendered clips go to the "media" branch (last 35 days, read from raw.githubusercontent.com), to
# the owner's private Telegram channel when that is set up, and with "autopost": true into the Buffer queue.
on:
  push:
    branches: [main]
    paths: ['jobs/*.json']
  workflow_dispatch:
    inputs:
      job:
        description: job file name in jobs/ (for example 2026-10-12-lovable.json), or several separated by spaces
        required: true
permissions:
  contents: write
jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.pick.outputs.files }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Pick job files
        id: pick
        env:
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ -n "$INPUT_JOB" ]; then
            files=""
            for j in $INPUT_JOB; do
              case "$j" in *[!a-z0-9.-]*) echo "bad job name: $j"; exit 1;; esac
              files="$files jobs/$j"
            done
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' | tr '\n' ' ')
          else
            files=$(git show --name-only --format= HEAD -- 'jobs/*.json' | tr '\n' ' ')
          fi
          json=$(FILES="$files" python3 -c 'import json,os; print(json.dumps(os.environ["FILES"].split()))')
          echo "files=$json" >> "$GITHUB_OUTPUT"
          [ "$json" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "jobs: $json"
  run:
    needs: pick
    if: needs.pick.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        file: ${{ fromJSON(needs.pick.outputs.files) }}
    concurrency:
      group: clips-${{ matrix.file }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Tools
        env:
          FILE: ${{ matrix.file }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("type") == "story" else 1)' "$FILE"; then
            sudo apt-get install -y -qq espeak-ng >/dev/null
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q -r requirements-story.txt
            python -m playwright install --with-deps chromium >/dev/null
          fi
      - name: Run, deliver, queue
        env:
          FILE: ${{ matrix.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLIPS_CHAT_ID: ${{ secrets.CLIPS_CHAT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MEDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/media
        run: |
          set -o pipefail
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          f="$FILE"
          echo "== $f" | tee -a run.log
          python -m clips.job "$f" --work work --out out 2>&1 | tee -a run.log
          id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$f")
          m="out/$id/manifest.json"
          grep -q '"stage": "rendered"' "$m" || exit 0
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then python -m clips.deliver "$m"; else echo "No Telegram token: skipped delivery"; fi
          auto=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("autopost", False))' "$f")
          {
            # The "media" branch is rebuilt each time with only the last 35 days, so the repo stays small. Several
            # runners may finish at once: each one rebuilds on top of the newest media commit and pushes with a lease,
            # and starts again if another runner got there first, so nobody's files are lost.
            ok=""
            for attempt in 1 2 3 4 5 6 7 8; do
              tmp=$(mktemp -d); mkdir -p "$tmp/keep"
              lease=""
              if git ls-remote --exit-code origin media >/dev/null; then
                git fetch -q --depth 1 origin +media:refs/remotes/origin/media
                lease=$(git rev-parse refs/remotes/origin/media)
                git --work-tree="$tmp/keep" checkout refs/remotes/origin/media -- . 2>/dev/null || true
                git reset -q
              fi
              cutoff=$(date -u -d '35 days ago' +%Y-%m-%d)
              for d in "$tmp"/keep/*/; do
                [ -d "$d" ] || continue
                n=$(basename "$d"); day=${n:0:10}
                if [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$day" < "$cutoff" ]]; then rm -rf "$d"; fi
              done
              rm -rf "${tmp:?}/keep/$id" && mkdir -p "$tmp/keep/$id" && cp out/"$id"/*.mp4 "$tmp/keep/$id/"
              GIT_INDEX_FILE="$tmp/index" git --work-tree="$tmp/keep" add -A .
              tree=$(GIT_INDEX_FILE="$tmp/index" git --work-tree="$tmp/keep" write-tree)
              commit=$(git commit-tree "$tree" -m "media up to $id")
              if git push -q --force-with-lease="refs/heads/media:$lease" origin "$commit:refs/heads/media"; then ok=1; break; fi
              echo "media branch moved, retry $attempt"; sleep $((RANDOM % 20 + 5))
            done
            [ -n "$ok" ] || { echo "Could not update the media branch"; exit 1; }
            first=$(find "out/$id" -maxdepth 1 -name '*.mp4' | sort | head -n 1); url="$MEDIA_BASE/$id/$(basename "$first")"
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I "$url")
              [ "$code" = "200" ] && break
              sleep 15
            done
            [ "$code" = "200" ] || { echo "Media file not reachable after 5 minutes"; exit 1; }
            if [ "$auto" = "True" ] && [ -n "$BUFFER_API_KEY" ]; then python -m clips.buffer queue "$m" --base-url "$MEDIA_BASE/$id"; fi
          } 2>&1 | tee -a run.log
      - name: Keep candidates and manifests
        if: always()
        run: |
          mkdir -p results
          for d in out/*/; do
            [ -d "$d" ] || continue
            id=$(basename "$d"); mkdir -p "results/$id"
            cp "$d"/*.json "results/$id/" 2>/dev/null || true
            cp work/"$id"/*.words.json "results/$id/" 2>/dev/null || true
          done
          mkdir -p results/_runs
          [ -f run.log ] && tail -n 150 run.log > "results/_runs/${{ github.run_id }}-${{ strategy.job-index }}.log"
          git add results
          [ -f .clips-chat.enc ] && git add .clips-chat.enc
          git diff --cached --quiet && exit 0
          git commit -q -m "results from run ${{ github.run_id }}"
          for _ in 1 2 3 4 5 6; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: clips-${{ github.run_id }}-${{ strategy.job-index }}
          path: out/**/*.mp4
          retention-days: 7
          if-no-files-found: ignore
